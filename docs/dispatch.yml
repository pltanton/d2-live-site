# Copy to pltanton/d2-live as .github/workflows/site.yml.
# Needs the SITE_DISPATCH_TOKEN secret: a fine-grained token for d2-live-site, Contents: read and write.
name: site

on:
  push:
    tags: ["v*"]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/pltanton/d2-live-site/dispatches \
            -f event_type=d2-live-release -f "client_payload[ref]=${GITHUB_REF_NAME}"
